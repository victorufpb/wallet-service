openapi: 3.0.3

info:
  title: User API
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: User
    description: Operations related to Users
  - name: Wallet
    description: Operations related to user wallets
paths:
  /users:
    post:
      tags:
        - User
      summary: Create new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - cpf
              properties:
                name:
                  type: string
                  example: Joao da Silva
                cpf:
                  type: string
                  example: 12345678906
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /users/{user_id}:
    get:
      tags:
        - User
      summary: Retrieve a user by ID
      parameters:
        - name: user_id
          in: path
          required: true
          description: Unique identifier of the user
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /wallets:
    post:
      tags:
        - Wallet
      summary: Create a new wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                  format: uuid
                  example: cc7cbd19-ef1c-4538-bc1c-d7e73ac49ba6
      responses:
        '201':
          description: Wallet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
  /wallets/{id}:
    get:
      tags:
        - Wallet
      summary: Retrieve a wallet by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the wallet
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Wallet retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
  /wallets/{id}/balance/transaction:
    post:
      tags:
        - Wallet
      summary: Perform a deposit or withdrawal transaction on a wallet
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransactionRequest'
      responses:
        '200':
          description: Transaction processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
  /wallets/{id}/balance/transfer:
    post:
      tags:
        - Wallet
      summary: Transfer balance to another wallet
      parameters:
        - name: id
          in: path
          required: true
          description: Source wallet ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransferRequest'
      responses:
        '200':
          description: Transfer completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
  /wallets/{id}/events:
    get:
      tags:
        - Wallet
      summary: Retrieve wallet events with pagination and filters
      parameters:
        - name: id
          in: path
          required: true
          description: Wallet ID
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            example: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            example: 2
        - name: start_date
          in: query
          required: false
          description: Start date filter (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: 2025-08-11
        - name: end_date
          in: query
          required: false
          description: End date filter (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: 2025-08-11
      responses:
        '200':
          description: Paginated list of wallet events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPageResponse'
components:
  schemas:
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 434db0b8-8478-41c4-8ff6-83df86c42573
        name:
          type: string
          example: Joao da Silva
        cpf:
          type: string
          example: 12345678906
        created_at:
          type: string
          format: date-time
          example: 2025-08-15T22:21:13.5091973
    WalletResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d1e8b142-a473-4a25-8bd9-c2d64da6df5d
        user_id:
          type: string
          format: uuid
          example: 538acd1d-a28e-41f8-a5c8-8799e6efeb4b
        amount:
          type: number
          format: float
          example: 0
        status:
          type: string
          enum: [ ACTIVE, INACTIVE ]
          example: ACTIVE
        created_at:
          type: string
          format: date-time
          example: 2025-08-15T22:33:08.9369295
    WalletTransactionRequest:
      type: object
      required:
        - transaction_type
        - amount
      properties:
        transaction_type:
          type: string
          enum: [ DEPOSIT, WITHDRAW ]
          example: DEPOSIT
        amount:
          type: number
          format: float
          example: 100.50
    TransactionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
    WalletTransferRequest:
      type: object
      required:
        - target_account_id
        - amount
      properties:
        target_account_id:
          type: string
          format: uuid
          example: bb39c642-773d-4768-ab52-5439cf9d05ba
        amount:
          type: number
          format: float
          example: 10
    WalletEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 88df7b7b-6c59-4c30-9b32-cd62cc88c4b6
        wallet_id:
          type: string
          format: uuid
          example: 3c3e8a6f-dc25-45f3-ba0a-3bd05897225c
        user_id:
          type: string
          format: uuid
          example: 41b3cde5-f937-4884-a4e2-b848e636029e
        operation:
          type: string
          enum: [ DEPOSIT, WITHDRAW, TRANSFER ]
          example: DEPOSIT
        action:
          type: string
          enum: [ MADE, RECEIVED ]
          example: MADE
        amount:
          type: number
          format: float
          example: 100.50
        created_at:
          type: string
          format: date-time
          example: 2025-08-11T23:27:44.894961
    EventPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WalletEvent'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 2
        total_pages:
          type: integer
          example: 2